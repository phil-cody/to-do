# Replace todo.example.com with your domain. Certbot will add HTTPS afterward.
server {
    listen 80;
    listen [::]:80;
    server_name todo.example.com;
    root /var/www/todo/current;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Hidden files and API paths never fall back to the application HTML.
    location ~ /\. { deny all; }
    location ~ ^/(?:package(?:-lock)?\.json|webpack\.config\.js|src/|node_modules/|docs/) { return 404; }
    location ~* \.(?:json|map|env|log)$ { return 404; }
    location /api/ { return 404; }
    location = /index.html { expires -1; }
    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|gif|woff2?)$ {
        try_files $uri =404;
        expires 7d;
    }
    location / { try_files $uri $uri/ /index.html; }
}
